name: Deploy (main)

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:  # Manual run: Actions → Deploy (main) → Run workflow

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build_images:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          submodules: false

      - name: Prepare image names
        id: meta
        run: |
          REPO_NAME=$(echo "${GITHUB_REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]')
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "backend_image=ghcr.io/${GITHUB_REPOSITORY_OWNER}/${REPO_NAME}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${GITHUB_REPOSITORY_OWNER}/${REPO_NAME}-frontend" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR (push)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.backend_image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.frontend_image }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.frontend_image }}:latest
          build-args: |
            GIT_SHA=${{ github.event.workflow_run.head_sha || github.sha }}
            BUILD_TIME=${{ github.event.workflow_run.updated_at || github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy on server (self-hosted runner)
    needs: build_images
    runs-on: self-hosted
    timeout-minutes: 10  # Fail if no runner picks up job within 10 min
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          submodules: false

      - name: Login to GHCR (pull)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      # ── PRE-FLIGHT: проверка нагрузки сервера перед деплоем ──────────────
      # Инцидент 15.08: деплой во время форк-бомбы (load 109) упал и сам
      # усугубил перегруз. Правило: мягкий перегруз → паузим тяжёлые воркеры;
      # катастрофа → abort (сначала стабилизация по DEPLOY_RUNBOOK.md).
      - name: Pre-deploy load check
        id: loadcheck
        run: |
          # NB: парсим ВЫВОД КОМАНД (uptime | ...), не «< uptime» (это файл!).
          LOAD1=$(uptime | awk -F'load average:' '{print $2}' | awk -F',' '{gsub(/[ ]/,"",$1); print $1}')
          CORES=$(nproc)
          CHROME=$(pgrep -fc chrome 2>/dev/null || true); CHROME=${CHROME:-0}
          AVAIL_MB=$(free -m | awk '/Mem:/{print $NF}')
          LIMIT_PAUSE=$((CORES * 3))   # 2 ядра → 6
          LIMIT_ABORT=$((CORES * 10))  # 2 ядра → 20
          echo "load1=${LOAD1:-?} cores=${CORES} chrome=${CHROME} avail_mb=${AVAIL_MB:-?}"
          echo "pause_if>${LIMIT_PAUSE} abort_if>${LIMIT_ABORT}"
          # защита от пустых значений: если метрика не спарсилась — НЕ валим деплой,
          # считаем консервативно «норма» и продолжаем (лог выше покажет ?)
          LOAD1=${LOAD1:-0}
          AVAIL_MB=${AVAIL_MB:-99999}

          ABORT=0
          # exit !(l>=t): успех(0) = перегруз. Поэтому && (не ||!) — иначе инверсия.
          awk -v l="$LOAD1" -v t="$LIMIT_ABORT" 'BEGIN{exit !(l>=t)}' && ABORT=1
          if [ "$ABORT" = "1" ]; then
            echo "::error::Сервер перегружен (load ${LOAD1} >= ${LIMIT_ABORT}) — вероятно инцидент. Деплой отменён. Стабилизация: docs/deployment/DEPLOY_RUNBOOK.md (chrome-процессов: ${CHROME})"
            exit 1
          fi
          if [ "$CHROME" -gt 200 ]; then
            echo "::error::Аномальное число chrome-процессов (${CHROME}) — форк-бомба? Деплой отменён. Runbook: docs/deployment/DEPLOY_RUNBOOK.md"
            exit 1
          fi
          PAUSE=0
          awk -v l="$LOAD1" -v t="$LIMIT_PAUSE" 'BEGIN{exit !(l>=t)}' && PAUSE=1 || PAUSE=0
          if [ "$PAUSE" = "1" ] || [ "$AVAIL_MB" -lt 500 ]; then
            echo "Мягкий перегруз — ставлю на паузу тяжёлые воркеры (enrich, search)"
            docker pause colaba-celery-worker-enrich-1 2>/dev/null || true
            docker pause colaba-celery-worker-search-1 2>/dev/null || true
            echo "paused=true" >> "$GITHUB_OUTPUT"
          else
            echo "Нагрузка в норме — деплою без паузы"
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync deploy files to /opt/colaba
        run: |
          mkdir -p /opt/colaba/scripts/deployment
          cp -f docker-compose.prod.yml /opt/colaba/docker-compose.prod.yml
          cp -f scripts/deployment/deploy.sh /opt/colaba/scripts/deployment/deploy.sh
          chmod +x /opt/colaba/scripts/deployment/deploy.sh

      - name: Deploy
        env:
          DEPLOY_PATH: /opt/colaba
          BACKEND_IMAGE: ${{ needs.build_images.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build_images.outputs.frontend_image }}
          IMAGE_TAG: ${{ needs.build_images.outputs.image_tag }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          /opt/colaba/scripts/deployment/deploy.sh

      # ── POST-DEPLOY: гарантированно снимаем паузу (даже если деплой упал) ──
      - name: Unpause workers (always)
        if: always() && steps.loadcheck.outputs.paused == 'true'
        run: |
          docker unpause colaba-celery-worker-enrich-1 2>/dev/null || true
          docker unpause colaba-celery-worker-search-1 2>/dev/null || true
          echo "Воркеры сняты с паузы"

      - name: Post-deploy smoke check
        if: always()
        run: |
          sleep 5
          if curl -sf -m 10 http://localhost:8000/api/v1/health > /dev/null 2>&1; then
            echo "Backend health: OK"
          else
            echo "::warning::Backend health не отвечает сразу после деплоя — проверь: docker logs colaba-backend-1 --tail=50"
          fi
          docker ps --format '{{.Names}}: {{.Status}}' | grep colaba || echo "::warning::Нет colaba-контейнеров!"

